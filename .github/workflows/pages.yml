name: Redirecionar GitHub Pages para a Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Gerar páginas de redirecionamento
        run: |
          mkdir -p dist
          page() {
            cat > "dist/$1" <<HTML
          <!doctype html>
          <html lang="pt-BR">
          <head>
          <meta charset="utf-8">
          <meta name="robots" content="noindex">
          <title>Indexa Tecnologia</title>
          <link rel="canonical" href="https://rota-studio-plum.vercel.app/$2">
          <meta http-equiv="refresh" content="0; url=https://rota-studio-plum.vercel.app/$2">
          <script>location.replace("https://rota-studio-plum.vercel.app/$2" + location.search + location.hash);</script>
          </head>
          <body><p>Mudamos de endereço: <a href="https://rota-studio-plum.vercel.app/$2">rota-studio-plum.vercel.app</a></p></body>
          </html>
          HTML
          }
          page index.html ""
          page painel.html painel
          page privacidade.html privacidade
          page termos.html termos
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Enviar arquivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
