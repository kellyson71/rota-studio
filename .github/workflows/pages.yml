name: Publicar GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Validar JavaScript
        run: |
          node --check app.js
          node --check selects.js
          node --check data.js
          node --check leads.js
          node --check store.js
          node --check seed.js
          node --check config.js
      - name: Preparar site
        run: |
          mkdir -p dist
          cp index.html style.css config.js store.js seed.js app.js selects.js data.js leads.js plano-original.html .nojekyll dist/
          cp -R kit dist/kit
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Enviar arquivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
